server {
    # __PORT__ is replaced with the Railway-provided $PORT by the entrypoint.
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cover/photo uploads (member photos, book covers) can exceed default limit.
    client_max_body_size 10M;

    # The SPA is served from the nginx webroot, API/admin proxied to gunicorn.

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Django static files (collected into /app/staticfiles by entrypoint)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Uploaded media (book covers, member photos, QR codes) - persisted volume
    location /media/ {
        alias /app/media/;
    }

    # Simple liveness check for Railway / curl
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # React SPA with fallback (deep links like /dashboard, /books work on refresh)
    location / {
        try_files $uri /index.html;
    }

    # Basic gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}