server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase body size for cover/photo uploads (nginx proxy to backend)
    client_max_body_size 10M;

    # --- Django API ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django admin (optional but useful) ---
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django static files (collected into shared volume) ---
    location /static/ {
        alias /srv/staticfiles/;
    }

    # --- Uploaded media (book covers, member photos, QR codes) ---
    location /media/ {
        alias /srv/mediafiles/;
    }

    # --- React SPA with fallback so /dashboard, /books, /guide etc. work on refresh ---
    location / {
        try_files $uri /index.html;
    }
}
